<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Behind a proxy that mounts the app under a subpath and strips it (Tailscale Serve at /gym),
  // https://host/gym loads this page but "./assets/…" resolves against the parent. Add the slash.
  var p = location.pathname;
  if (p.length > 1 && p.slice(-1) !== '/' && !/\.[a-z0-9]+$/i.test(p)) location.replace(p + '/' + location.search + location.hash);
  // The page language before first paint: English, or Italian when the profile picked it
  // (i18n-core LANGS). Both read left to right; the app re-applies it in lib/i18n.js setLang.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    document.documentElement.lang = s.lang === 'it' ? 'it' : 'en';
  } catch (e) {}
</script>
<title>openGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
